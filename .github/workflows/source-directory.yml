# .github/workflows/source-directory.yml
name: Source directory

on:
  schedule:
    - cron: "0 7 2 * *"   # 07:00 UTC on the 2nd of each month
  workflow_dispatch:
    inputs:
      tile:
        description: "One tile id (blank = every tile)"
        required: false
        default: ""
      release:
        description: "Overture release (blank = newest)"
        required: false
        default: ""
      min_confidence:
        description: "Minimum Overture confidence"
        required: false
        default: "0.6"
      dry_run:
        description: "Classify and match but do not write"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      tiles: ${{ steps.t.outputs.tiles }}
      release: ${{ steps.validate.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - id: validate
        env:
          TILE: ${{ inputs.tile }}
          RELEASE: ${{ inputs.release }}
          MIN_CONF: ${{ inputs.min_confidence || '0.6' }}
        run: |
          # No release given (the monthly run): use Overture's newest. A pinned
          # default would reload the same month forever, and Overture deletes
          # old releases from S3 after a few months.
          if [ -z "$RELEASE" ]; then
            RELEASE=$(curl -sf "https://overturemaps-us-west-2.s3.us-west-2.amazonaws.com/?list-type=2&prefix=release/&delimiter=/"               | grep -o '<Prefix>release/[^<]*' | sed 's#<Prefix>release/##; s#/$##'               | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$' | sort | tail -1)
            echo "Latest Overture release: $RELEASE"
          fi
          # Validate release format: YYYY-MM-DD.N
          if ! [[ "$RELEASE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$ ]]; then
            echo "Invalid release format: $RELEASE (expected YYYY-MM-DD.N)" >&2
            exit 1
          fi
          # Validate min_confidence format: 0.N or 1.0 or 1
          if ! [[ "$MIN_CONF" =~ ^0?\.[0-9]+$|^1(\.0+)?$ ]]; then
            echo "Invalid min_confidence: $MIN_CONF (expected 0.N or 1)" >&2
            exit 1
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
      - id: t
        env:
          TILE: ${{ inputs.tile }}
        run: |
          if [ -n "$TILE" ]; then
            # Validate tile against real ids
            deno eval "const tile = Deno.env.get('TILE'); import {tiles} from './supabase/functions/_shared/venue-match.ts'; const validIds = tiles().map(t => t.id); if (!validIds.includes(tile)) { throw new Error('Invalid tile: ' + tile); } console.log(tile);" > /dev/null
            echo "tiles=[\"$TILE\"]" >> "$GITHUB_OUTPUT"
          else
            TILE_LIST=$(deno eval 'import {tiles} from "./supabase/functions/_shared/venue-match.ts"; console.log(JSON.stringify(tiles().map(t=>t.id)))')
            echo "tiles=$TILE_LIST" >> "$GITHUB_OUTPUT"
          fi

  venues:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        tile: ${{ fromJSON(needs.plan.outputs.tiles) }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install DuckDB
        run: python -m pip install --quiet duckdb
      - name: Extract
        env:
          MATRIX_TILE: ${{ matrix.tile }}
          RELEASE: ${{ needs.plan.outputs.release }}
          MIN_CONF: ${{ inputs.min_confidence || '0.6' }}
        run: |
          mkdir -p out
          deno run --allow-read scripts/directory/extract.sql.ts "$MATRIX_TILE" "$RELEASE" "$MIN_CONF" > extract.sql
          # The Python package was verified against Overture's S3 data on 2026-10-01.
          python -c "import duckdb; con = duckdb.connect(); [con.execute(s) for s in open('extract.sql').read().split(';') if s.strip()]"
          echo "places: $(wc -l < "out/$MATRIX_TILE.ndjson" 2>/dev/null || echo 0)"
      - name: Load venues
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MATRIX_TILE: ${{ matrix.tile }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          deno run -A scripts/directory/load-venues.ts --tile "$MATRIX_TILE" --in "out/$MATRIX_TILE.ndjson" $DRY_RUN | tee -a "$GITHUB_STEP_SUMMARY"
